<!DOCTYPE html><html><head><meta charset="utf-8"><title>Blockland</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#111;overflow:hidden;font-family:'Press Start 2P',monospace;color:#fff;user-select:none;-webkit-user-select:none}
canvas,img{image-rendering:pixelated}
#cv{position:fixed;inset:0;width:100%;height:100%}
#fl{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;transition:opacity .4s;z-index:3}
#x{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px;display:none;pointer-events:none;mix-blend-mode:difference;z-index:4}
#x:before,#x:after{content:'';position:absolute;background:#fff}#x:before{left:8px;top:0;width:2px;height:18px}#x:after{top:8px;left:0;height:2px;width:18px}
#m{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.45);overflow:auto;padding:16px 8px;z-index:10}
.b{width:min(400px,90vw);height:40px;background:#707070;border:3px solid;border-color:#d0d0d0 #3c3c3c #3c3c3c #d0d0d0;outline:2px solid #000;color:#fff;font:inherit;font-size:11px;text-shadow:2px 2px #333;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 6px}
.b:hover:not(:disabled){background:#7d7d7d;border-color:#fff #3c3c3c #3c3c3c #fff;color:#ffffa0}.b:active:not(:disabled){background:#6a6a6a}.b:disabled{color:#999;cursor:default}
.b.half{width:min(196px,44vw)}.b.sm{height:32px;font-size:9px}
.in{background:#000;border:2px solid #a0a0a0;text-align:center;text-shadow:none;cursor:text;caret-color:#fff;color:#fff}
.in:focus{border-color:#fff;outline:none}
.logo{font-size:min(9vw,54px);line-height:1.1;text-align:center;color:#dcdcdc;letter-spacing:2px;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,5px 5px 0 #3a3a3a}
.spl{color:#ff0;font-size:12px;text-shadow:2px 2px #3f3f00;margin:-6px 0 14px 120px;animation:pul .5s infinite alternate}
@keyframes pul{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(-6deg) scale(1.09)}}
.t{font-size:13px;margin-bottom:4px;text-shadow:2px 2px #333}
.sub{font-size:8px;color:#bbb;text-shadow:1px 1px #000;line-height:1.7;text-align:center}
.row{display:flex;gap:8px;width:min(400px,90vw)}.row .b{flex:1;width:auto}
.foot{position:fixed;bottom:4px;font-size:8px;color:#ddd;text-shadow:1px 1px #000}
.wlist{width:min(460px,94vw);max-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:2px}
.wrow{background:rgba(0,0,0,.5);border:2px solid #666;padding:8px;cursor:pointer}
.wrow.on{border-color:#fff;background:rgba(40,40,60,.6)}
.wrow .wn{font-size:10px}.wrow .wi{font-size:8px;color:#999;margin-top:5px}
.frow{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.45);border:2px solid #555;padding:6px;font-size:9px;width:min(460px,94vw)}
.frow .gr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;background:#666;flex:none}.dot.on{background:#5c5}.dot.host{background:#fd5}
.kbr{display:flex;justify-content:space-between;align-items:center;width:min(440px,92vw);gap:8px;font-size:9px}
.kbr .b{width:180px;height:30px;font-size:9px;flex:none}
.pnl{background:#c6c6c6;border:3px solid;border-color:#fff #555 #555 #fff;outline:2px solid #000;padding:12px;color:#3f3f3f;display:flex;gap:14px;text-shadow:none}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.tt{font-size:10px;color:#3f3f3f}

.slot:hover{background:#a8a8a8}

.res{width:48px;height:48px}
.arrow{font-size:20px;color:#5a5a5a;font-family:monospace;align-self:center}
.rbook{width:220px;max-height:60vh;display:flex;flex-direction:column;gap:4px}
.rlist{overflow-y:auto;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.rrow{display:flex;gap:6px;align-items:center;background:#9c9c9c;border:2px solid;border-color:#7a7a7a #c9c9c9 #c9c9c9 #7a7a7a;padding:3px 5px;font-size:8px;color:#222;cursor:pointer;text-align:left}
.rrow:hover{background:#b0b0c8}
.rrow.off{opacity:.45}
.rrow canvas{width:24px;height:24px;flex:none}
.trow{display:flex;gap:6px;align-items:center;background:#9c9c9c;border:2px solid;border-color:#7a7a7a #c9c9c9 #c9c9c9 #7a7a7a;padding:4px 6px;font-size:8px;color:#222;cursor:pointer;width:240px}

.trow canvas{width:22px;height:22px;flex:none}
.trow span{white-space:nowrap}
#hud{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:3px;width:min(424px,98vw);pointer-events:none;z-index:5}
#itname{font-size:10px;text-shadow:2px 2px #000;opacity:0;transition:opacity .5s;margin-bottom:2px;min-height:12px}
#hr{display:flex;justify-content:space-between;width:100%;margin-bottom:2px}#hr div{display:flex}#hr img{width:16px;height:14px;margin-right:-1px}#hl{flex-direction:column;gap:1px}#ar{display:none}#ar img{width:16px;height:16px;margin-right:-1px;image-rendering:pixelated}
#hb{display:flex;background:rgba(8,8,8,.6);border:2px solid #161616;outline:1px solid rgba(150,150,150,.5);padding:1px}
.hsl{width:44px;height:44px;background:rgba(0,0,0,.32);border:1px solid #3c3c3c;position:relative;display:flex;align-items:center;justify-content:center}

.tabs{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}

.tab.on{background:#c6c6c6;border-color:#fff #494949 #494949 #fff;color:#1c1c1c}
.hsl canvas{width:32px;height:32px}
#dbg{position:fixed;top:4px;left:4px;font-size:8px;line-height:1.8;display:none;background:rgba(0,0,0,.4);padding:4px 6px;z-index:6;pointer-events:none}
#chat{position:fixed;left:6px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(440px,86vw);z-index:6;pointer-events:none}
#cmsgs{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.cmsg{background:rgba(0,0,0,.45);padding:3px 6px;font-size:9px;width:fit-content;max-width:100%;word-break:break-word}
#cin{display:none;width:100%;background:rgba(0,0,0,.6);border:1px solid #888;color:#fff;font:inherit;font-size:10px;padding:5px 6px;pointer-events:auto}
#cur{position:fixed;pointer-events:none;z-index:99;display:none;width:40px;height:40px}
#cur canvas{width:36px;height:36px}
#tip{position:fixed;z-index:100;display:none;background:rgba(16,0,16,.95);border:2px solid #350a7a;padding:6px 8px;font-size:9px;pointer-events:none;max-width:280px}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:98;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.tst{background:rgba(0,0,0,.75);border:2px solid #666;padding:6px 10px;font-size:9px;animation:tstf 3s forwards}
@keyframes tstf{0%,75%{opacity:1}100%{opacity:0}}
</style></head><body>
<canvas id="cv"></canvas><div id="fl"></div><div id="x"></div>
<div id="hud"><div id="itname"></div><div id="hr"><div id="hl"><div id="ar"></div><div id="he"></div></div><div id="hg"></div></div><div id="hb"></div></div>
<div id="chat"><div id="cmsgs"></div><input id="cin" maxlength="120" autocomplete="off"></div>
<div id="m"></div>
<div id="cur"></div><div id="tip"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script>
'use strict';
const $=i=>document.getElementById(i),F=Math.floor,R=Math.random,H=96,SEA=48,PI=Math.PI,ck=(a,b)=>(a+4096)*8192+b+4096;
const pre=n=>(n||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyCode=c=>(c||'').replace('Key','').replace('Digit','').replace('Left','L').replace('Right','R').replace('Control','Ctrl');
// ---------- safe storage (works even in sandboxed previews) ----------
const MEM={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return k in MEM?MEM[k]:null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){delete MEM[k]}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}
const jget=(k,d)=>{try{const s=lsGet(k);return s==null?d:JSON.parse(s)}catch(e){return d}};
const jset=(k,v)=>lsSet(k,JSON.stringify(v));
// ---------- cross-tab bus: BroadcastChannel + localStorage storage events ----------
const TAB='t'+Date.now()+F(R()*1e6);
const MSEEN=new Set(); // shared dedupe across local bus AND online (MQTT), so a message never applies twice
const BUS=(()=>{let bc=null;try{bc=new BroadcastChannel('bl_bus')}catch(e){}
const hs=[];let n=0;
function recv(m){if(!m||m._t==TAB||!m._i)return;if(MSEEN.has(m._i))return;MSEEN.add(m._i);if(MSEEN.size>500)MSEEN.clear();hs.forEach(h=>{try{h(m)}catch(e){}})}
if(bc)bc.onmessage=e=>recv(e.data);
addEventListener('storage',e=>{if(e.key=='bl_bus'&&e.newValue){try{recv(JSON.parse(e.newValue))}catch(x){}}});
return{emit(m){if(!m._i)m._i=TAB+'_'+(n++);m._t=TAB;if(bc)try{bc.postMessage(m)}catch(e){}try{lsSet('bl_bus',JSON.stringify(m))}catch(e){}},on(h){hs.push(h)}}})();
// ---------- options & keybinds ----------
const DKB={forward:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',jump:'Space',sneak:'ShiftLeft',sprint:'ControlLeft',inventory:'KeyE',eat:'KeyF',portal:'KeyM',chat:'KeyT',debug:'F3'};
const KLBL={forward:'Walk Forward',back:'Walk Backward',left:'Strafe Left',right:'Strafe Right',jump:'Jump / Fly Up',sneak:'Sneak / Fly Down',sprint:'Sprint',inventory:'Inventory',eat:'Eat Food',portal:'Dimension Travel',chat:'Chat',debug:'Debug Info'};
let KB=Object.assign({},DKB,jget('bl_keys',{}));
let OP=Object.assign({fov:70,rd:5,sens:10,clouds:1,fps:0,autojump:1,bright:0,invert:0,tex:1},jget('bl_opt',{}));
function saveOP(){jset('bl_opt',OP)}
// ---------- accounts (stored locally in the browser) ----------
function hsh(p){let h=5381;for(let i=0;i<p.length;i++)h=((h*33)^p.charCodeAt(i))>>>0;return 'h'+h.toString(36)}
let USER=null;
const accs=()=>jget('bl_acc',{});
const myFrd=()=>jget('bl_frd_'+USER,{f:[],rin:[]});
function session(){const s=lsGet('bl_user')||ssGet('bl_user');if(s&&accs()[s])USER=s}
function doLogin(u,stay){USER=u;if(stay)lsSet('bl_user',u);else{lsDel('bl_user');ssSet('bl_user',u)}mqDisconnect();mqConnect()}
function doLogout(){mqDisconnect();USER=null;lsDel('bl_user');ssDel('bl_user')}
session();
// ---------- presence (who is online in other tabs / windows) ----------
const PEERS={};
setInterval(()=>{if(USER)BUS.emit({t:'pres',u:USER,host:mp&&mp.role=='host'?{code:mp.code,name:WORLD?WORLD.name:'World',n:1+Object.keys(mp.players).length}:null})},2500);
setInterval(()=>{const n=Date.now();for(const u in PEERS)if(n-PEERS[u].ts>6500)delete PEERS[u]},3000);
function toast(t){const d=document.createElement('div');d.className='tst';d.textContent=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),3000)}
// ---------- ONLINE play: real internet multiplayer & friends via a public MQTT broker ----------
// No game server of our own — every client talks to a free public broker, so friends can
// find each other and join worlds across the internet (not just in this browser).
const MQB=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const NS='blnd2'; // our topic namespace on the shared broker
const MQS={c:null,i:0,ok:0,try:0};
const ONL={}; // username -> {ts,host:{code,name,n}} friends/players seen online via the broker
const mqT=s=>String(s||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,24);
const mqPkt=o=>JSON.stringify(o);
function mqConnect(){
 if(!window.mqtt||!USER||MQS.c)return;
 const me=USER;
 const will={topic:NS+'/p/'+mqT(me),payload:mqPkt({u:me,off:1}),retain:true,qos:1};
 let c=null;
 try{c=mqtt.connect(MQB[MQS.i%MQB.length],{clientId:'blc'+mqT(me)+F(R()*1e8),keepalive:30,clean:true,reconnectPeriod:2500,connectTimeout:7000,will})}catch(e){return}
 MQS.c=c;
 c.on('connect',()=>{MQS.ok=1;MQS.try=0;
  try{c.subscribe(NS+'/p/+',{qos:1})}catch(e){}
  try{c.subscribe([NS+'/r/'+mqT(me)+'/+',NS+'/a/'+mqT(me)+'/+',NS+'/d/'+mqT(me)+'/+'],{qos:1})}catch(e){}
  if(mp&&mp.role=='host')try{c.subscribe(NS+'/w/'+mqT(mp.code)+'/c',{qos:1})}catch(e){}
  if(mp&&mp.role=='guest')try{c.subscribe(NS+'/w/'+mqT(mp.code)+'/b',{qos:1});if(mp.wait)mpsend({t:'join',code:mp.code,u:USER,pid:mp.pid},1)}catch(e){}
  mqPres();
  setTimeout(mqFlush,800); // deliver anything that piled up while we were offline
  toast('Online! Friends & multiplayer now work across the internet')});
 c.on('message',(t,p)=>mqRecv(t,p));
 c.on('error',()=>{});
 c.on('close',()=>{MQS.ok=0});
 c.on('offline',()=>{MQS.ok=0});
 setTimeout(()=>{if(MQS.c==c&&!MQS.ok){MQS.try++;try{c.end(true)}catch(e){}MQS.c=null;if(MQS.try<9&&USER)setTimeout(mqConnect,600)}},8500)}
function mqDisconnect(){if(!MQS.c)return;mqOff();try{MQS.c.end(true)}catch(e){}MQS.c=null;MQS.ok=0}
function mqPres(){ // who I am + whether I'm hosting a world (retained, so others see it instantly)
 if(!MQS.c||!MQS.ok||!USER)return;
 const h=mp&&mp.role=='host'?{code:mp.code,name:WORLD?WORLD.name:'World',n:1+Object.keys(mp.players).length}:null;
 try{MQS.c.publish(NS+'/p/'+mqT(USER),mqPkt({u:USER,ts:Date.now(),host:h}),{qos:1,retain:true})}catch(e){}}
function mqOff(){if(!MQS.c||!USER)return;try{MQS.c.publish(NS+'/p/'+mqT(USER),mqPkt({u:USER,off:1}),{qos:1,retain:true})}catch(e){}}
function mqClear(top){if(!MQS.c)return;try{MQS.c.publish(top,'',{qos:1,retain:true})}catch(e){}}
function mqPubR(top,p){if(!MQS.c||!MQS.ok)return;try{MQS.c.publish(top,p,{qos:1,retain:true})}catch(e){}}
function netRefresh(){if((st=='friends'||st=='mp')&&Date.now()-lastFR>1200){lastFR=Date.now();scr(st)}}
function mqRecv(top,p){
 const q=top.split('/');
 let m=null;try{m=JSON.parse(new TextDecoder().decode(p))}catch(e){return}
 if(q.length==3&&q[1]=='p'){ // presence
  if(m&&m.u&&m.u!=USER){
   if(m.off)delete ONL[m.u];
   else ONL[m.u]={ts:Date.now(),host:m.host||null};
   netRefresh()}
  return}
 if(!USER||!m)return;
 if(q[1]=='r'&&q[2]==mqT(USER)&&m.f){onFreq(m.f);mqClear(top);return}      // friend request for me
 if(q[1]=='a'&&q[2]==mqT(USER)&&m.f){onFacc(m.f);mqClear(top);return}      // my request was accepted
 if(q[1]=='d'&&q[2]==mqT(USER)&&m.f){onFdel(m.f);mqClear(top);return}      // I was removed
 if(q[1]=='w'&&q.length>=4&&m.t){ // world traffic
  if(!m._i||MSEEN.has(m._i))return;
  MSEEN.add(m._i);if(MSEEN.size>500)MSEEN.clear();
  mpmsg(m)}}
function onFreq(u){const f=myFrd();
 if(f.f.includes(u))return;
 if(!f.rin.includes(u)){f.rin.push(u);jset('bl_frd_'+USER,f)}
 toast(u+' sent you a friend request!');
 if(st=='friends')scr('friends')}
function onFacc(u){const f=myFrd();f.rin=f.rin.filter(x=>x!=u);f.out=(f.out||[]).filter(x=>x!=u);
 if(!f.f.includes(u))f.f.push(u);
 jset('bl_frd_'+USER,f);
 toast(u+' accepted your friend request!');
 if(st=='friends')scr('friends')}
function onFdel(u){const f=myFrd();f.f=f.f.filter(x=>x!=u);f.rin=f.rin.filter(x=>x!=u);f.out=(f.out||[]).filter(x=>x!=u);jset('bl_frd_'+USER,f);
 if(st=='friends')scr('friends')}
let mqN=0;
const MQQ=[]; // internet outbox: world messages are queued while the connection is down and flushed on reconnect
function mpsend(m,dbl){ // send a world/multiplayer message over BOTH the local bus and the internet
 // dbl: critical one-shot messages (join/init/chat/close/loot) are published twice with the same _id —
 // the receiver dedupes by _i, so content shows once, but a single lost packet no longer loses the event
 if(!m._i)m._i='m'+Date.now().toString(36)+(mqN++).toString(36)+F(R()*1e6).toString(36);
 BUS.emit(m);
 if(!m.t)return;
 if(MQS.ok&&mp){try{const tp=NS+'/w/'+mqT(m.code||mp.code)+'/'+(mp.role=='host'?'b':'c'),pl=JSON.stringify(m);
  MQS.c.publish(tp,pl,{qos:1});if(dbl)MQS.c.publish(tp,pl,{qos:1});return}catch(e){}}
 if(mp){MQQ.push(m);if(dbl)MQQ.push(m);if(MQQ.length>400)MQQ.splice(0,MQQ.length-400)}}
function mqFlush(){ // send the outbox, keeping only the newest of each snapshot type (pos/pall/mob/tm)
 if(!MQS.ok||!mp||!MQQ.length)return;
 const last={},out=[];
 for(let i=MQQ.length-1;i>=0;i--){const m=MQQ[i];
  if(m.t=='pos'){const k='pos:'+m.pid;if(last[k])continue;last[k]=1}
  else if(m.t=='pall'||m.t=='mob'||m.t=='tm'){if(last[m.t])continue;last[m.t]=1}
  out.push(m)}
 out.reverse();
 const seen=new Set();
 for(const m of out){if(seen.has(m._i))continue;seen.add(m._i); // queued dbl copies: one publish is enough, the retry is the second copy
  try{MQS.c.publish(NS+'/w/'+mqT(m.code||mp.code)+'/'+(mp.role=='host'?'b':'c'),JSON.stringify(m),{qos:1})}catch(e){}}
 MQQ.length=0}
setInterval(()=>{if(MQS.ok){mqPres();mqFlush()}},25000);
setInterval(()=>{if(MQS.ok)mqFlush()},3000);
setInterval(()=>{if(mp&&mp.role=='host'&&MQS.ok&&Object.keys(mp.players).length)mpsend({t:'sync',code:mp.code,edits:EDser()})},45000);
setInterval(()=>{const n=Date.now();for(const u in ONL)if(n-ONL[u].ts>85000)delete ONL[u]},5000);
mqConnect();
// ---------- game state ----------
let hold=0,brk=null,dim=0,jm='',seed=42,rs=1,st='title',cre=0,diff=1,bk='title',sel=0,T=.3,L=1,oa=0,ox0=0,oz0=0,sx=0,sz=0,spT=0,fr=0,sw=0,hh=-1,hg=-1,tg=null,last=0;
let VISP=new Set(); // villages populated with villagers this session (mobs aren't saved, so this resets on load)
let fly=0,lastSpace=0,dbgOn=0,chatOpen=0,binding=null,hostSel=0,WSEL=null,delConf=0,ltab='login',lstay=1,MPSEL=null,MPHOSTU=null,DISC='',lmx=0,lmy=0,fpsC=0,fpsT=0,fpsV=0,UIDC=0,RD=OP.rd;
const K={};
let SLOTS=new Array(36).fill(null); // 0-8 hotbar, 9-35 main
let CUR=null;                        // stack held by the mouse in GUIs
let CG=new Array(9).fill(null);      // 3x3 crafting grid (2x2 uses 0,1,3,4)
